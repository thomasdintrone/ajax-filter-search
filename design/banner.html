<!doctype html>
<html><head><meta charset="utf-8"><title>Ajax Filter Search banner</title>
<style>
  html,body{margin:0;width:1544px;height:500px;overflow:hidden;background:#0a4fb3}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#fff;position:relative}
  .bg{position:absolute;inset:0;background:linear-gradient(115deg,#06348a 0%,#0a53b8 42%,#2b9bf0 100%)}
  .swoosh{position:absolute;right:-200px;top:-260px;width:1100px;height:900px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.14),rgba(255,255,255,0));}
  .swoosh2{position:absolute;left:-300px;bottom:-520px;width:1300px;height:800px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,20,80,.35),rgba(0,20,80,0));}
  .icon{position:absolute;left:88px;top:150px;width:200px;height:200px;filter:drop-shadow(0 16px 24px rgba(0,20,80,.45))}
  .copy{position:absolute;left:336px;top:122px;width:740px}
  h1{margin:0;font-size:80px;line-height:1.05;font-weight:800;letter-spacing:-1.5px;white-space:nowrap}
  p{margin:18px 0 0;font-size:29px;line-height:1.3;font-weight:500;color:#dcecff;max-width:660px}
  .chips{display:flex;gap:12px;margin-top:30px}
  .chip{background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 20px;font-size:22px;font-weight:600}
  .panel{position:absolute;left:1112px;top:70px;width:410px;height:360px;background:#f8fafc;border-radius:26px;box-shadow:0 30px 60px rgba(0,15,70,.45);padding:24px;box-sizing:border-box}
  .tabs{display:flex;gap:12px}
  .tab{height:42px;border-radius:12px;background:#e2e8f0;flex:1}
  .tab.on{background:#0a6cf0}
  .tab i{display:block;height:6px;border-radius:4px;background:#94a3b8;width:56%;margin:18px auto 0}
  .tab.on i{background:#fff}
  .search{margin-top:18px;height:48px;border-radius:24px;background:#fff;border:2px solid #cbd5e1;position:relative}
  .search svg{position:absolute;left:16px;top:10px}
  .cards{display:flex;gap:14px;margin-top:20px}
  .card{flex:1}
  .thumb{height:84px;border-radius:12px;background:#b8c9dc;position:relative;overflow:hidden}
  .thumb.on{background:#2a86e3}
  .thumb:before{content:"";position:absolute;left:-10px;right:-10px;bottom:-28px;height:74px;background:#7f9bb7;clip-path:polygon(0 100%,38% 22%,62% 62%,78% 40%,100% 100%)}
  .thumb.on:before{background:#0b58b6}
  .thumb:after{content:"";position:absolute;right:16px;top:14px;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.65)}
  .line{height:9px;border-radius:5px;background:#a3b2c4;margin-top:11px}
  .line.s{width:60%;margin-top:8px}
  .badge{position:absolute;left:-52px;top:92px;width:104px;height:104px;border-radius:50%;background:#fff;box-shadow:0 12px 24px rgba(0,20,80,.35);display:flex;align-items:center;justify-content:center}
  .badge div{width:84px;height:84px;border-radius:50%;background:linear-gradient(#1a95f0,#0561e0);display:flex;align-items:center;justify-content:center}
</style></head><body>
<div class="bg"></div><div class="swoosh"></div><div class="swoosh2"></div>
<img class="icon" src="icon-master.png" alt="">
<div class="copy">
  <h1>Ajax Filter Search</h1>
  <p>Search, filter and paginate your posts without a page reload.</p>
  <div class="chips"><span class="chip">Search</span><span class="chip">Categories</span><span class="chip">Month &amp; Year</span><span class="chip">List &amp; Grid</span></div>
</div>
<div class="panel">
  <div class="badge"><div><svg width="46" height="46" viewBox="0 0 46 46"><path d="M5 7h36L27 24v13l-8 4V24z" fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div></div>
  <div class="tabs"><div class="tab on"><i></i></div><div class="tab"><i></i></div><div class="tab"><i></i></div></div>
  <div class="search"><svg width="28" height="28" viewBox="0 0 28 28"><circle cx="12" cy="12" r="8" fill="none" stroke="#64748b" stroke-width="3"/><path d="M18 18l7 7" stroke="#64748b" stroke-width="3.5" stroke-linecap="round"/></svg></div>
  <div class="cards">
    <div class="card"><div class="thumb on"></div><div class="line"></div><div class="line s"></div></div>
    <div class="card"><div class="thumb"></div><div class="line"></div><div class="line s"></div></div>
    <div class="card"><div class="thumb"></div><div class="line"></div><div class="line s"></div></div>
  </div>
</div>
</body></html>
