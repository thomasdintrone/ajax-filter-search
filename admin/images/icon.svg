<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Ajax Filter Search icon. Source of truth for .wordpress-org/icon-*.png and the logo in design/banner.html.
       Geometry is exact: the card is one rectangle, and the filter badge is drawn last so it sits on top of everything. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3a96"/>
      <stop offset="0.55" stop-color="#0a56bd"/>
      <stop offset="1" stop-color="#2493ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a95f0"/>
      <stop offset="1" stop-color="#0561e0"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#001450" flood-opacity="0.42"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#001450" flood-opacity="0.38"/>
    </filter>
    <clipPath id="t1"><rect x="96" y="276" width="96" height="76" rx="12"/></clipPath>
    <clipPath id="t2"><rect x="208" y="276" width="96" height="76" rx="12"/></clipPath>
    <clipPath id="t3"><rect x="320" y="276" width="96" height="76" rx="12"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- Card, contents and badge are scaled together, so every edge stays exact. -->
  <g transform="translate(250 262) scale(1.08) translate(-250 -262)">
  <!-- The card: one rectangle, x 68 to 444. -->
  <rect x="68" y="118" width="376" height="296" rx="30" fill="#f8fafc" filter="url(#cardShadow)"/>

  <!-- Tabs -->
  <rect x="96" y="148" width="96" height="40" rx="12" fill="#0a6cf0"/>
  <rect x="208" y="148" width="96" height="40" rx="12" fill="#e2e8f0"/>
  <rect x="320" y="148" width="96" height="40" rx="12" fill="#e2e8f0"/>
  <rect x="117" y="164" width="54" height="7" rx="3.5" fill="#ffffff"/>
  <rect x="229" y="164" width="54" height="7" rx="3.5" fill="#94a3b8"/>
  <rect x="341" y="164" width="54" height="7" rx="3.5" fill="#94a3b8"/>

  <!-- Search -->
  <rect x="97" y="207" width="318" height="48" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="126" cy="230" r="9" fill="none" stroke="#64748b" stroke-width="3.5"/>
  <path d="M133 237l8 8" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

  <!-- Result tiles -->
  <g clip-path="url(#t1)">
    <rect x="96" y="276" width="96" height="76" fill="#2a86e3"/>
    <path d="M86 360 L128 298 L150 328 L166 312 L202 360 Z" fill="#0b58b6"/>
    <circle cx="170" cy="296" r="9" fill="#ffffff" fill-opacity="0.7"/>
  </g>
  <g clip-path="url(#t2)">
    <rect x="208" y="276" width="96" height="76" fill="#b8c9dc"/>
    <path d="M198 360 L240 298 L262 328 L278 312 L314 360 Z" fill="#7f9bb7"/>
    <circle cx="282" cy="296" r="9" fill="#ffffff" fill-opacity="0.7"/>
  </g>
  <g clip-path="url(#t3)">
    <rect x="320" y="276" width="96" height="76" fill="#b8c9dc"/>
    <path d="M310 360 L352 298 L374 328 L390 312 L426 360 Z" fill="#7f9bb7"/>
    <circle cx="394" cy="296" r="9" fill="#ffffff" fill-opacity="0.7"/>
  </g>
  <rect x="96" y="364" width="96" height="8" rx="4" fill="#a3b2c4"/>
  <rect x="96" y="379" width="58" height="8" rx="4" fill="#a3b2c4"/>
  <rect x="208" y="364" width="96" height="8" rx="4" fill="#a3b2c4"/>
  <rect x="208" y="379" width="58" height="8" rx="4" fill="#a3b2c4"/>
  <rect x="320" y="364" width="96" height="8" rx="4" fill="#a3b2c4"/>
  <rect x="320" y="379" width="58" height="8" rx="4" fill="#a3b2c4"/>

  <!-- Filter badge: last, so it sits above the card and everything on it. -->
  <g filter="url(#badgeShadow)">
    <circle cx="424" cy="232" r="54" fill="#ffffff"/>
  </g>
  <circle cx="424" cy="232" r="43" fill="url(#badge)"/>
  <g transform="translate(401 209)">
    <path d="M5 7h36L27 24v13l-8 4V24z" fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  </g>
  </g>
</svg>
