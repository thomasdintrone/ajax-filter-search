# Local dev stack (fallback for wp-env, which needs to build images and currently fails on some machines).
#   docker compose up -d --wait
#   docker compose run --rm wpcli wp core install --url=http://localhost:${AFS_PORT:-8890} --title=AFS --admin_user=admin --admin_password=password --admin_email=dev@example.com --skip-email
#   docker compose run --rm wpcli wp plugin activate ajax-filter-search
#   docker compose run --rm wpcli wp eval-file wp-content/plugins/ajax-filter-search/bin/seed-test-content.php
#   bin/smoke-test.sh http://localhost:${AFS_PORT:-8890}
#   docker compose down -v
# Pick another WordPress/PHP: WP_IMAGE=wordpress:6.5-php8.2-apache docker compose up -d --wait
services:
  db:
    image: mariadb:10.5
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-uroot", "-proot", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 40
  wordpress:
    image: ${WP_IMAGE:-wordpress:php8.4-apache}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${AFS_PORT:-8890}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_HOME', 'http://localhost:${AFS_PORT:-8890}' );
        define( 'WP_SITEURL', 'http://localhost:${AFS_PORT:-8890}' );
    volumes:
      - wp:/var/www/html
      - .:/var/www/html/wp-content/plugins/ajax-filter-search:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php"]
      interval: 3s
      timeout: 3s
      retries: 40
  wpcli:
    image: wordpress:cli
    profiles: ["tools"]
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wp
    volumes:
      - wp:/var/www/html
      - .:/var/www/html/wp-content/plugins/ajax-filter-search:ro
volumes:
  wp:
